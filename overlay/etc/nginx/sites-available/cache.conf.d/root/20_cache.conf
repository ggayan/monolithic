    # Cache Location
    slice 1m;
    proxy_cache generic;

    proxy_ignore_headers Expires Cache-Control;
    proxy_cache_valid 200 206 CACHE_MAX_AGE;
    proxy_set_header  Range $slice_range;

    # Only download one copy at a time and use a large timeout so
    # this really happens, otherwise we end up wasting bandwith
    # getting the file multiple times.
    proxy_cache_lock on;
    # If a 1MB slice takes longer than 30s, something is likely wrong.
    # Allow the next request to try fetching (faster recovery from stuck downloads)
    proxy_cache_lock_age 30s;
    # If cache population is broken, bypass after 3 minutes instead of waiting forever.
    # This prevents hour-long outages when upstream has persistent issues.
    proxy_cache_lock_timeout 3m;

    # Allow the use of stale entries
    proxy_cache_use_stale error timeout invalid_header updating http_500 http_502 http_503 http_504;

    # When serving stale content, fetch fresh copy in background.
    # This enables self-healing: corrupt/stale entries get replaced automatically
    # without blocking the client request.
    proxy_cache_background_update on;

    # Allow caching of 200 but not 301 or 302 as our cache key may not include query params
    # hence may not be valid for all users
    proxy_cache_valid 301 302 0;

    # Enable cache revalidation
    proxy_cache_revalidate on;
    
    # Don't cache requests marked as nocache=1
    proxy_cache_bypass $arg_nocache;

    # 40G max file
    proxy_max_temp_file_size 40960m;

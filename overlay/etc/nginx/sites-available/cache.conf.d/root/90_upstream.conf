    # Upstream Configuration

    # Retry conditions: retry on errors, timeouts, and various upstream failures.
    # invalid_header catches incomplete/malformed responses (helps prevent caching partial data)
    proxy_next_upstream error timeout http_404 http_500 http_502 http_503 http_504 invalid_header;
    proxy_next_upstream_tries 3;
    proxy_next_upstream_timeout 0;

    # Enable TCP keepalives to detect dead upstream connections faster.
    # Without this, silently dropped connections wait for full read timeout.
    proxy_socket_keepalive on;

    # Connection timeouts - fail fast to enable retry logic
    proxy_connect_timeout 10s;
    proxy_read_timeout 150s;
    proxy_send_timeout 60s;

    # Proxy into the redirect handler
    proxy_pass http://127.0.0.1:3128$request_uri;

    proxy_redirect off;
    proxy_ignore_client_abort on;

    # Upstream request headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

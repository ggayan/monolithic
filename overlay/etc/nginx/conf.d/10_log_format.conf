    # Log format for cache monitoring
    # Upstream variables enable detection of partial/failed downloads:
    #   $upstream_status         - HTTP status from origin (detect 5xx errors)
    #   $upstream_response_length - Bytes from origin (compare with bytes_sent to detect truncation)
    #   $request_time            - Total request processing time
    #   $upstream_response_time  - Time waiting for upstream response
    #   $upstream_cache_key      - Cache key (enables O(1) cache file deletion via MD5)
    log_format cachelog '[$cacheidentifier] $remote_addr / $http_x_forwarded_for - $remote_user [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent" "$upstream_cache_status" "$host" "$http_range" "$upstream_status" $upstream_response_length $request_time $upstream_response_time "$upstream_cache_key"';
    log_format cachelog-json escape=json '{"timestamp":"$msec","time_local":"$time_local","cache_identifier":"$cacheidentifier","remote_addr":"$remote_addr","forwarded_for":"$http_x_forwarded_for","remote_user":"$remote_user","status":"$status","bytes_sent":$body_bytes_sent,"referer":"$http_referer","user_agent":"$http_user_agent","upstream_cache_status":"$upstream_cache_status","host":"$host","http_range":"$http_range","method":"$request_method","path":"$request_uri","proto":"$server_protocol","scheme":"$scheme","upstream_status":"$upstream_status","upstream_bytes":"$upstream_response_length","request_time":$request_time,"upstream_time":"$upstream_response_time","cache_key":"$upstream_cache_key"}';

[program:cache-health]
command=/scripts/cache-health-daemon.sh
autostart=false
autorestart=true
startretries=3
stdout_events_enabled=true
stderr_events_enabled=true
# Performance tuning: MAX_SCAN_FILES limits cache scans to prevent excessive I/O
# PARALLEL_JOBS controls parallel search workers (default: CPU count)
# CHECK_INTERVAL increased to 600s (10min) for large caches
environment=DRY_RUN="true",ERROR_THRESHOLD="5",CONFIRM_THRESHOLD="3",CHECK_INTERVAL="600",MAX_SCAN_FILES="100000",PARALLEL_JOBS="4"
